name: DIY
description: 'DIY.org is a safe, ad-free creative platform where kids turn ideas into
  real games, apps, and websites — guided by AI tools like Vibe Coding and KidsGPT and
  reviewed by human moderators. Serving over 500,000 young creators, it pairs game-building
  templates, AI image and art tools, badge-based learning, and 75+ standards-aligned
  courses with parent and classroom dashboards, SSO, and safety controls. Originally
  a maker community for kids, DIY is backed by Kleiner Perkins and Slow Ventures.'
